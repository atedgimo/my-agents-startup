# Kubernetes Manifests (for Local Clusters like kind/minikube)

## 1. Deployment (Deployment.yaml)
# Defines the desired state of the application pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-tracker-deployment
  labels:
    app: habit-tracker
spec:
  replicas: 2 # Run two replicas for basic high availability simulation
  selector:
    matchLabels:
      app: habit-tracker
  template:
    metadata:
      labels:
        app: habit-tracker
    spec:
      containers:
      - name: backend
        # NOTE: Replace 'your-repo/habit-tracker:latest' with the actual image built locally.
        image: your-repo/habit-tracker:latest 
        ports:
        - containerPort: "8000"
        env:
          # In a real K8s setup, persistent storage (PVC) should be used for SQLite.
          # For local testing simplicity, we assume the volume mount handles persistence.
          - name: DATABASE_NAME
            value: "local_tracker.db"
---
## 2. Service (Service.yaml)
# Exposes the Deployment internally within the cluster network.
apiVersion: v1
kind: Service
metadata:
  name: habit-tracker-service
spec:
  selector:
    app: habit-tracker # Selects pods with this label
  ports:
    - protocol: TCP
      port: 80 # The port the service exposes (external access)
      targetPort: 8000 # The port the container is listening on
  type: ClusterIP # Use ClusterIP for internal cluster communication