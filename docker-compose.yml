version: '3.8'
services:
  backend:
    # Builds the service using the Dockerfile in the current directory
    build: .
    container_name: habit_tracker_backend
    restart: always
    ports:
      # Map host port 8000 to container port 8000
      - "8000:8000"
    volumes:
      # Persist the SQLite database file outside the container for easy access/backup
      # This ensures data survives container restarts.
      - ./data/local_tracker.db:/app/src/backend/local_tracker.db
      # Mount source code to allow hot reloading during development (optional, but useful)
      - ./src/backend:/app/src/backend:ro
      - ./src/frontend:/app/src/frontend:ro
    environment:
      # Set environment variables if needed (e.g., database connection strings)
      PYTHONPATH: /app/src/backend

  # Optional: If we were serving the frontend separately, we would add a 'frontend' service here.
  # Since FastAPI serves static files and runs on port 8000, one service is sufficient for local deployment.