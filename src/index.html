<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chomp - Retro Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; }
        canvas { border: 4px solid #1f2937; image-rendering: pixelated; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
    <div class="text-center mb-8">
        <h1 class="text-6xl font-bold text-yellow-400 mb-2">CHOMP</h1>
        <p class="text-gray-400 uppercase tracking-widest">Retro Pac-Man Clone</p>
    </div>

    <div class="relative inline-block">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <div class="mt-8 text-xl font-mono">
        Score: <span id="scoreLabel" class="text-yellow-400">0</span>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
